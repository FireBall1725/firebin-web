<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/firebin-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FireBin — self-hosted electronics component inventory." />
    <title>FireBin</title>
    <script>
      // Apply the saved theme before paint to avoid a flash. When nothing is
      // stored we leave data-theme unset so the CSS prefers-color-scheme
      // default wins; the toggle writes 'light' | 'dark' to localStorage.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
