name: CI

# The jobs live in FireBall1725/workflows so every React client runs the same
# ones. Change them there, not here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: FireBall1725/workflows/.github/workflows/ci-node.yml@v1
    with:
      # Matches the Dockerfile's node:22-alpine.
      node-version: "22"
