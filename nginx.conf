server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.
    location /api {
        proxy_pass http://firebin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # A full-instance import/restore is the whole database as JSON and can be
        # tens of MB; the default 1m cap would 413 it before it reaches the api,
        # which itself accepts up to 256 MiB on /api/v1/import.
        client_max_body_size 256m;
    }

    # Serve the SPA — all client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
